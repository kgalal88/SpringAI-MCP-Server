server:
  port: 8081
spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: mcp-server
        enabled: true
  datasource:
    url: jdbc:h2:mem:testdb
  jpa:
    hibernate.ddl-auto: update
  sql:
    init:
      mode: always
logging:
  level:
    org.springframework.ai.mcp: TRACE
    io.modelcontextprotocol: TRACE
    org.springframework.web: DEBUG